# Stable deployment identity preserves existing containers and volumes after the rename.
name: asr-en-vi

services:
  app:
    image: ${ASR_IMAGE:-asr-studio:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${ASR_SOURCE_REVISION:-unknown}
    command:
      - uvicorn
      - asr_studio.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --no-proxy-headers
      - --no-server-header
      - --no-access-log
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ASR_PORT:-8765}:8765"
    environment:
      ASR_DATA_DIR: /var/lib/asr-studio/data
      ASR_AUTH_DIR: /var/lib/asr-studio/auth
      ASR_PROVIDER_DIR: /var/lib/asr-studio/provider
      ASR_INSTALL_DIR: /var/lib/asr-studio/install
      ASR_PUBLIC_URL: ${ASR_PUBLIC_URL:-http://127.0.0.1:${ASR_PORT:-8765}}
      ASR_CHATGPT_CALLBACK_URL: ${ASR_CHATGPT_CALLBACK_URL:-}
      ASR_COOKIE_SECURE: ${ASR_COOKIE_SECURE:-false}
      ASR_MAX_UPLOAD_BYTES: ${ASR_MAX_UPLOAD_BYTES:-4294967296}
      ASR_UPLOAD_CHUNK_BYTES: ${ASR_UPLOAD_CHUNK_BYTES:-67108864}
      ASR_MAX_RECORDING_SECONDS: ${ASR_MAX_RECORDING_SECONDS:-14400}
      ASR_GPU_MODEL_PATH: ${ASR_GPU_MODEL_PATH:-/models/whisper-large-v3}
      ASR_PHOWHISPER_MODEL_PATH: ${ASR_PHOWHISPER_MODEL_PATH:-/models/pho-whisper-large}
      ASR_QWEN_MODEL_PATH: ${ASR_QWEN_MODEL_PATH:-/models/qwen3-asr-1.7b}
      ASR_DIARIZATION_MODEL_PATH: ${ASR_DIARIZATION_MODEL_PATH:-/models/speaker-diarization-community-1}
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYANNOTE_METRICS_ENABLED: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - data:/var/lib/asr-studio/data
      - auth:/var/lib/asr-studio/auth
      - provider:/var/lib/asr-studio/provider
      - model-install:/var/lib/asr-studio/install
      - "${ASR_MODEL_HOST_PATH:-./models}:/models:ro"
    healthcheck:
      test: ["CMD", "python", "-m", "asr_studio.cli", "health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  worker:
    image: ${ASR_IMAGE:-asr-studio:local}
    command: ["python", "-m", "asr_studio.worker"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASR_DATA_DIR: /var/lib/asr-studio/data
      ASR_PROVIDER_DIR: /var/lib/asr-studio/provider
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_MODEL_PATH: ${ASR_MODEL_PATH:-}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-}
      ASR_GPU_MODEL_PATH: ${ASR_GPU_MODEL_PATH:-/models/whisper-large-v3}
      ASR_PHOWHISPER_MODEL_PATH: ${ASR_PHOWHISPER_MODEL_PATH:-/models/pho-whisper-large}
      ASR_QWEN_MODEL_PATH: ${ASR_QWEN_MODEL_PATH:-/models/qwen3-asr-1.7b}
      ASR_CPU_MODEL_PATH: ${ASR_CPU_MODEL_PATH:-/models/whisper-small}
      ASR_GPU_COMPUTE_TYPE: ${ASR_GPU_COMPUTE_TYPE:-float16}
      ASR_CPU_COMPUTE_TYPE: ${ASR_CPU_COMPUTE_TYPE:-int8}
      ASR_DIARIZATION_MODEL_PATH: ${ASR_DIARIZATION_MODEL_PATH:-/models/speaker-diarization-community-1}
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYANNOTE_METRICS_ENABLED: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - data:/var/lib/asr-studio/data
      - provider:/var/lib/asr-studio/provider
      - "${ASR_MODEL_HOST_PATH:-./models}:/models:ro"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "asr_studio.worker", "--health-check"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s

  # The only service with the network and a writable /models. It mounts neither data, auth nor
  # provider, so it sees no recording, transcript or credential; app asks it for a model through
  # the small model-install volume (ADR 0012).
  model-installer:
    image: ${ASR_IMAGE:-asr-studio:local}
    command: ["python", "-m", "asr_studio.model_installer"]
    init: true
    restart: unless-stopped
    read_only: true
    # /models is a host directory: the installer writes it as the user that owns it.
    user: "${ASR_MODEL_UID:-1000}:${ASR_MODEL_GID:-1000}"
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASR_INSTALL_DIR: /var/lib/asr-studio/install
      ASR_GPU_MODEL_PATH: ${ASR_GPU_MODEL_PATH:-/models/whisper-large-v3}
      ASR_PHOWHISPER_MODEL_PATH: ${ASR_PHOWHISPER_MODEL_PATH:-/models/pho-whisper-large}
      ASR_QWEN_MODEL_PATH: ${ASR_QWEN_MODEL_PATH:-/models/qwen3-asr-1.7b}
      HF_HOME: /tmp/huggingface
      # Xet keeps a chunk cache under HF_HOME, and /tmp is memory: download over plain HTTP.
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - model-install:/var/lib/asr-studio/install
      - "${ASR_MODEL_HOST_PATH:-./models}:/models:rw"
    stop_grace_period: 15s

volumes:
  data:
  auth:
  provider:
  model-install:
